[package]
name = "mesh-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "At-rest record encryption compatible with Mesh Talk"

[dependencies]
aes-gcm = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "0.17.14"
zeroize = "1"

[dev-dependencies]
pbkdf2 = "0.12"
sha2 = "0.10"
