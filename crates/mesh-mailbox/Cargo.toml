[package]
name = "mesh-mailbox"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Opaque recipient-pair envelopes for Mesh Talk relay compatibility"

[dependencies]
aes-gcm = "0.11"
bincode = "1.3"
hkdf = "0.12"
mesh-identity = { path = "../mesh-identity" }
mesh-replication = { path = "../mesh-replication", default-features = false, features = ["legacy-wire"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
zeroize = "1"
mesh-storage = { path = "../mesh-storage" }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
mesh-connect = { path = "../mesh-connect", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "time"] }
