[package]
name = "mesh-blob"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Chunk encryption and integrity verification for mesh blobs"

[features]
mesh-connect = ["dep:mesh-connect", "dep:tokio"]

[dependencies]
mesh-connect = { path = "../mesh-connect", default-features = false, optional = true }
tokio = { version = "1", features = ["io-util", "sync", "time"], optional = true }
aes-gcm = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
zeroize = "1"
futures-util = "0.3"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
mesh-identity = { path = "../mesh-identity" }
