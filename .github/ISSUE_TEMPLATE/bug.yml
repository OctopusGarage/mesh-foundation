name: Bug report
description: Report a reproducible SDK defect
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Remove secrets and personal data."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: SDK commit, crate, features, Rust version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands or a small sanitized example.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
