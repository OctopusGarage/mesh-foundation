name: Publish crates.io
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag (for example v0.1.0-alpha.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: crates-io-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and successful SDK matrix
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          rustup show active-toolchain
          python3 scripts/sdk.py check --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
          gh api "repos/$GH_REPO/commits/$(git rev-parse HEAD)/check-runs?per_page=100" > /tmp/checks.json
          python3 - <<'PY'
          import json
          checks = json.load(open('/tmp/checks.json'))['check_runs']
          for os in ['ubuntu-latest', 'macos-latest', 'windows-latest']:
              name = f'verify ({os})'
              matches = [c for c in checks if c['name'] == name and c['app']['slug'] == 'github-actions']
              if not matches or max(matches, key=lambda c: c['id'])['conclusion'] != 'success':
                  raise SystemExit(f'Required SDK check has not passed: {name}')
          PY
      - name: Test release policy
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify registry packages without uploading
        run: cargo publish --workspace --dry-run --locked --registry crates-io
      - name: Authenticate with crates.io Trusted Publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish coordinated packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked --registry crates-io
