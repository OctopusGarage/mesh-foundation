name: SDK
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: python scripts/sdk.py check
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked -p mesh-connect --no-default-features
      - run: cargo test --locked -p mesh-replication --no-default-features
      - run: cargo test --locked -p mesh-replication --no-default-features --features mesh-connect

  source:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release source and build archive
        shell: bash
        run: |
          python scripts/sdk.py check --tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor HEAD origin/main
          mkdir -p release
          git archive --format=tar.gz --prefix="mesh-foundation-$GITHUB_REF_NAME/" \
            --output="release/mesh-foundation-$GITHUB_REF_NAME.tar.gz" HEAD
          git rev-parse HEAD > release/COMMIT
          cd release
          sha256sum "mesh-foundation-$GITHUB_REF_NAME.tar.gz" COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-foundation-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
